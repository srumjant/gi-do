<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gigi &amp; Dodo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; overflow: hidden; }
    /* The game's container is also what goes full screen (main.ts), so it paints the page's
       colour itself: behind a full-screen element the browser shows black. */
    #game { position: relative; width: 100%; height: 100%; background: #10131a; }
    /* Phaser sizes, centres and pixelates the canvas itself (FIT, CENTER_BOTH, pixelArt). */
    #game canvas { display: block; }
    /* The full-screen button, the live game's (index.html:17-18). gfx/fullscreen.ts wires it. */
    #fullscreen {
      position: absolute; top: 8px; right: 8px; z-index: 1; width: 40px; height: 40px; padding: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff;
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); border-radius: 8px;
      transition: opacity 0.4s;
    }
    #fullscreen:hover, #fullscreen:active { background: rgba(255,255,255,0.4); }
    #fullscreen[hidden] { display: none; }
    #fullscreen.idle:not(:hover) { opacity: 0; }
    #fullscreen.on .enter, #fullscreen:not(.on) .leave { display: none; }
    /* The touch buttons, the live game's (index.html:19-47): only on a coarse pointer, over the
       bottom of the game, a D-pad on the left and the action buttons on the right.
       input/touchControls.ts wires them. */
    #touch-controls { display: none; position: absolute; bottom: 0; left: 0; right: 0; z-index: 1;
      padding: 6px 12px 10px; pointer-events: none; justify-content: space-between; align-items: flex-end; }
    @media (pointer: coarse) {
      #touch-controls { display: flex; }
    }
    #touch-controls .pad, #touch-controls .actions { pointer-events: auto; }
    .tbtn { width: 60px; height: 60px; padding: 0; border-radius: 50%; color: #fff; font: 22px sans-serif;
      background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      touch-action: none; -webkit-tap-highlight-color: transparent; }
    .tbtn.pressed { background: rgba(255,255,255,0.45); border-color: rgba(255,255,255,0.7); }
    .tbtn.small { width: 44px; height: 44px; font-size: 16px; }
    .tbtn.big { width: 74px; height: 74px; font-size: 28px; background: rgba(100,200,255,0.2); border-color: rgba(100,200,255,0.4); }
    .tbtn.big.pressed { background: rgba(100,200,255,0.45); }
    .tbtn.ok { background: rgba(100,255,100,0.2); border-color: rgba(100,255,100,0.4); font-size: 14px; font-weight: bold; }
    .tbtn.ok.pressed { background: rgba(100,255,100,0.45); }
    #touch-controls .pad { display: grid; grid-template-columns: 60px 44px 60px; grid-template-rows: 44px 60px;
      gap: 3px; align-items: center; justify-items: center; }
    #touch-controls .actions { display: flex; flex-direction: column; gap: 5px; align-items: center; }
    #touch-controls .row { display: flex; gap: 8px; align-items: center; }
    @media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
      #touch-controls { padding: 4px 16px 6px; }
      .tbtn { width: 50px; height: 50px; font-size: 18px; }
      .tbtn.small { width: 38px; height: 38px; }
      .tbtn.big { width: 62px; height: 62px; }
      #touch-controls .pad { grid-template-columns: 50px 38px 50px; grid-template-rows: 38px 50px; }
    }
  </style>
</head>
<body>
  <div id="game">
    <button id="fullscreen" type="button" tabindex="-1" hidden>
      <svg class="enter" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <svg class="leave" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
    <div id="touch-controls">
      <div class="pad">
        <span></span><button class="tbtn small" id="btn-up" type="button">▲</button><span></span>
        <button class="tbtn" id="btn-left" type="button">◀</button><button class="tbtn small" id="btn-down" type="button">▼</button><button class="tbtn" id="btn-right" type="button">▶</button>
      </div>
      <div class="actions">
        <div class="row">
          <button class="tbtn small" id="btn-back" type="button">❚❚</button>
          <button class="tbtn big" id="btn-jump" type="button">⤒</button>
        </div>
        <div class="row">
          <button class="tbtn" id="btn-shoot" type="button">🏹</button>
          <button class="tbtn ok" id="btn-ok" type="button">OK</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

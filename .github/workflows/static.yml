# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life on 2026-04-30. Vite 8 requires Node ^20.19.0 ||
          # >=22.12.0 and Vitest 4 requires ^20.0.0 || ^22.0.0 || >=24.0.0, so 24 (the
          # current Active LTS) satisfies both without relying on an EOL runtime.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: next/package-lock.json

      - name: Test and build the Phaser version
        working-directory: next
        run: |
          npm ci
          npm test
          npm run build

      # The live game keeps the root. The Phaser build is published under /next/ so the
      # kids can try it in progress without anything being switched over.
      - name: Stage both games
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude 'next' --exclude '.git' ./ _site/
          mkdir -p _site/next
          cp -R next/dist/. _site/next/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

function resizeCanvas() {
  const isFS=!!(document.fullscreenElement||document.webkitFullscreenElement);
  const maxScale=isFS?999:2;
  // On mobile, leave space for controls
  const isMobile='ontouchstart' in window;
  const availH=isMobile&&!isFS?window.innerHeight*0.65:window.innerHeight;
  const s = Math.min(window.innerWidth/BASE_W, availH/BASE_H, maxScale);
  canvas.width=BASE_W; canvas.height=BASE_H;
  canvas.style.width=Math.floor(BASE_W*s)+'px'; canvas.style.height=Math.floor(BASE_H*s)+'px';
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(f,d,t,v,sl) {
  try { ensureAudio(); const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t||'square';
  o.frequency.setValueAtTime(f,now); if(sl) o.frequency.linearRampToValueAtTime(sl,now+d);
  // Smooth attack/release to avoid clicks
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v||0.15,now+0.008);
  g.gain.linearRampToValueAtTime((v||0.15)*0.6,now+d*0.6);
  g.gain.linearRampToValueAtTime(0,now+d);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+d+0.01); } catch(e){}
}

let bgmNoteIdx=0, bgmNextTime=0, bgmScheduleTimer=null;
function playBGMNote(type,freq,t,dur,vol){
  if(!freq||freq===0)return; // rest note
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.setValueAtTime(vol*0.85,t+dur*0.3);
  g.gain.linearRampToValueAtTime(vol*0.5,t+dur*0.7);
  g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.01);
}
function playPercNote(type,t,vol){
  // type 1=kick, 2=hihat
  if(type===0)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  if(type===1){o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.linearRampToValueAtTime(40,t+0.08);
    g.gain.setValueAtTime(vol*0.7,t);g.gain.linearRampToValueAtTime(0,t+0.1);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.12);
  } else {
    // Noise-like hihat via high detuned oscillator
    const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
    o.type='square';o.frequency.setValueAtTime(800,t);
    o2.type='square';o2.frequency.setValueAtTime(1283,t);
    g.gain.setValueAtTime(vol*0.25,t);g.gain.linearRampToValueAtTime(0,t+0.04);
    g2.gain=g;o.connect(g);o2.connect(g);g.connect(audioCtx.destination);
    o.start(t);o2.start(t);o.stop(t+0.05);o2.stop(t+0.05);
  }
}
function startBGM(levelIdx){
  stopBGM();
  if(levelIdx<0||levelIdx>=BGM_THEMES.length)return;
  bgmLevel=levelIdx; bgmNoteIdx=0;
  ensureAudio();
  bgmNextTime=audioCtx.currentTime+0.1;
  const theme=BGM_THEMES[levelIdx];
  const interval=60/theme.bpm;
  function scheduleNotes(){
    if(bgmLevel!==levelIdx)return;
    try{
      while(bgmNextTime<audioCtx.currentTime+0.4){
        const i=bgmNoteIdx;
        const f=theme.notes[i%theme.notes.length];
        const bf=theme.bassN[i%theme.bassN.length];
        const dur=interval*0.85;
        const t=bgmNextTime;
        // Melody
        playBGMNote(theme.wave,f,t,dur,theme.vol);
        // Bass
        playBGMNote(theme.bass,bf,t,dur*1.1,theme.bassVol);
        // Harmony (thirds/fifths)
        if(theme.harmN){
          const hf=theme.harmN[i%theme.harmN.length];
          playBGMNote(theme.harm||'triangle',hf,t,dur*0.7,theme.harmVol||0.012);
        }
        // Percussion
        if(theme.perc){
          const pp=theme.perc[i%theme.perc.length];
          playPercNote(pp,t,0.06);
        }
        bgmNextTime+=interval;
        bgmNoteIdx++;
      }
    }catch(e){}
    bgmScheduleTimer=setTimeout(scheduleNotes,120);
  }
  scheduleNotes();
}
function stopBGM(){if(bgmScheduleTimer){clearTimeout(bgmScheduleTimer);bgmScheduleTimer=null;}if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}bgmLevel=-1;}

const spriteCache=new Map();
function getSpriteKey(d,p,sc,fl){return d.length+'_'+d[0].length+'_'+sc+'_'+(fl?1:0)+'_'+Object.values(p).join(',')+'_'+d.map(r=>r.join('')).join('');}
function getCachedSprite(d,p,sc,fl){
  const key=getSpriteKey(d,p,sc,fl);
  let cached=spriteCache.get(key);
  if(cached)return cached;
  const w=d[0].length*sc,h=d.length*sc;
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const ox=oc.getContext('2d');
  if(fl){ox.translate(w,0);ox.scale(-1,1);}
  for(let r=0;r<d.length;r++) for(let c=0;c<d[r].length;c++){const v=d[r][c];if(!v)continue;ox.fillStyle=p[v];ox.fillRect(c*sc,r*sc,sc,sc);}
  spriteCache.set(key,oc);
  return oc;
}
function drawSprite(d,x,y,p,sc,fl) {
  const cached=getCachedSprite(d,p,sc,fl);
  ctx.drawImage(cached,Math.round(x),Math.round(y));
}

function makeGround(w,h){ const m=Array.from({length:h},()=>Array(w).fill(0)); for(let y=h-2;y<h;y++) for(let x=0;x<w;x++) m[y][x]=1; return m; }
function addPlats(m,ps){ ps.forEach(([px,py,pw])=>{for(let i=0;i<pw;i++)if(px+i<m[0].length)m[py][px+i]=2;}); }
function addQBlocks(m,qs){ qs.forEach(([qx,qy])=>m[qy][qx]=3); }
function addRainbowBlock(m,pos){ pos.forEach(([rx,ry])=>{ if(m[ry]&&rx<m[0].length) m[ry][rx]=5; }); }
function addGaps(m,gs,h,gapMult){
  gs.forEach(([gx,gw])=>{
    const actualW = Math.max(1, Math.round(gw * gapMult));
    for(let i=0;i<actualW;i++) for(let gy=h-2;gy<h;gy++) if(gx+i<m[0].length) m[gy][gx+i]=0;
  });
}

function drawParallax(lvlIdx){
  const pd=PARALLAX[lvlIdx];if(!pd)return;
  // Sky gradient: top is lighter, bottom blends to first layer
  const grad=ctx.createLinearGradient(0,0,0,BASE_H);
  const lvl=LEVELS[lvlIdx];
  grad.addColorStop(0,lvl.bg);
  grad.addColorStop(1,pd.bg2||lvl.bg);
  ctx.fillStyle=grad;ctx.fillRect(0,0,BASE_W,BASE_H);
  // Draw each parallax layer as rolling hills
  pd.layers.forEach(layer=>{
    const scrollX=camera.x*layer.speed;
    const baseY=BASE_H*layer.y;
    ctx.fillStyle=layer.color;
    ctx.beginPath();ctx.moveTo(0,BASE_H);
    const hillW=BASE_W/(layer.hills.length-1);
    for(let i=0;i<=layer.hills.length;i++){
      const hi=i%layer.hills.length;
      const x=i*hillW-((scrollX*0.5)%hillW);
      const peakY=baseY-layer.hills[hi]*BASE_H+Math.sin(i*1.3+scrollX*0.002)*8;
      if(i===0)ctx.moveTo(x,peakY);
      else{
        const px=(i-1)*hillW-((scrollX*0.5)%hillW);
        const cpx=(px+x)/2;
        const prevPeakY=baseY-layer.hills[(i-1)%layer.hills.length]*BASE_H+Math.sin((i-1)*1.3+scrollX*0.002)*8;
        ctx.quadraticCurveTo(px+(x-px)*0.5,Math.min(prevPeakY,peakY)-5,x,peakY);
      }
    }
    ctx.lineTo(BASE_W+50,BASE_H);ctx.lineTo(-50,BASE_H);ctx.closePath();ctx.fill();
  });
}

function getTile(px,py){const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE),l=LEVELS[currentLevel];if(tx<0||ty<0||ty>=l.height||tx>=l.width)return 0;return map[ty][tx];}
function isSolid(t){return t===1||t===2||t===3||t===5;}
function rectOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function spawnEnemy(def){
  const dc=DC(), gy=findGroundY(def.x), info=getEnemySpriteInfo(def.type);
  const h=spriteH(info.sprite,ENEMY_SCALE), w=spriteW(info.sprite,ENEMY_SCALE);
  const e={type:def.type,x:def.x*TILE,y:gy-h,vx:-0.8*dc.enemySpeed,alive:true,frame:0,frameTimer:0,w,h,squashTimer:0};
  if(def.type==='ghost'){e.y=gy-h-40;e.vx=0;e.originY=e.y;e.noGravity=true;}
  if(def.type==='bat'||def.type==='icebat'){e.y=gy-h-60;e.originY=e.y;e.vx=-1.2*dc.enemySpeed;e.noGravity=true;e.sineOffset=Math.random()*Math.PI*2;}
  if(def.type==='cannon'){e.vx=0;e.shootTimer=60+Math.floor(Math.random()*60);e.shootInterval=dc.enemyShootInterval;e.noStomp=true;}
  if(def.type==='bouncer'){e.vx=-1.0*dc.enemySpeed;e.bounceTimer=0;}
  if(def.type==='penguin'){e.vx=-0.6*dc.enemySpeed;}
  return e;
}

function update(){
  animFrame++;
  if(powerupPopup){powerupPopup.timer--;if(powerupPopup.timer<=0)powerupPopup=null;clearJP();return;}
  // Language toggle
  if(justPressed['KeyL']){lang=lang==='et'?'en':'et';justPressed['KeyL']=false;}
  // Debug level selector — hold B for 3 seconds
  if(debugHoldStart>0&&keys['KeyB']&&gameState!=='debug'&&Date.now()-debugHoldStart>=3000){
    gameState='debug';debugLevelIndex=0;debugHoldStart=0;
    // Ensure we have difficulty & character set
    if(!selectedDifficulty)selectedDifficulty=DIFF_KEYS[0];
    if(!selectedChar)selectedChar='gigi';
  }
  if(gameState==='debug'){
    if(justPressed['ArrowLeft']||justPressed['KeyA'])debugLevelIndex=Math.max(0,debugLevelIndex-1);
    if(justPressed['ArrowRight']||justPressed['KeyD'])debugLevelIndex=Math.min(LEVELS.length-1,debugLevelIndex+1);
    if(justPressed['ArrowUp']||justPressed['KeyW']){diffIndex=(diffIndex-1+DIFF_KEYS.length)%DIFF_KEYS.length;selectedDifficulty=DIFF_KEYS[diffIndex];}
    if(justPressed['ArrowDown']||justPressed['KeyS']){diffIndex=(diffIndex+1)%DIFF_KEYS.length;selectedDifficulty=DIFF_KEYS[diffIndex];}
    if(justPressed['Space']||justPressed['Enter']){
      ensureAudio();currentLevel=debugLevelIndex;lives=DC().lives;score=0;initLevel(currentLevel);
      justPressed['Space']=false;justPressed['Enter']=false;
    }
    if(justPressed['Escape']){gameState='title';justPressed['Escape']=false;}
    clearJP();return;
  }
  if(gameState==='title'){
    if(justPressed['Space']||justPressed['Enter']){ensureAudio();startBGM(BGM_TITLE);gameState='modeselect';modeIndex=0;justPressed['Space']=false;justPressed['Enter']=false;}
    // Keyboard shortcut straight into learn mode (kept for habit)
    if(justPressed['KeyO']){ensureAudio();startBGM(BGM_TITLE);gameState='learnmenu';learnMenuIdx=0;justPressed['KeyO']=false;}
    clearJP();return;
  }
  if(gameState==='modeselect'){
    if(justPressed['ArrowLeft']||justPressed['KeyA'])modeIndex=0;
    if(justPressed['ArrowRight']||justPressed['KeyD'])modeIndex=1;
    if(justPressed['KeyO']){modeIndex=1;}
    if(justPressed['Space']||justPressed['Enter']){
      ensureAudio();sfxPickup();
      if(modeIndex===0){gameState='difficulty';diffIndex=0;}
      else{gameState='learnmenu';learnMenuIdx=0;}
      justPressed['Space']=false;justPressed['Enter']=false;
    }
    if(justPressed['Escape']){gameState='title';justPressed['Escape']=false;}
    clearJP();return;
  }
  if(gameState==='learnmenu'||gameState==='learnletters'||gameState==='learnsyllables'||gameState==='learnresult'){updateLearn();return;}
  if(gameState==='difficulty'){
    if(justPressed['ArrowLeft']||justPressed['KeyA']){diffIndex=Math.max(0,diffIndex-1);}
    if(justPressed['ArrowRight']||justPressed['KeyD']){diffIndex=Math.min(DIFF_KEYS.length-1,diffIndex+1);}
    if(justPressed['Space']||justPressed['Enter']){selectedDifficulty=DIFF_KEYS[diffIndex];gameState='select';selectIndex=0;justPressed['Space']=false;justPressed['Enter']=false;}
    if(justPressed['Escape']){gameState='modeselect';modeIndex=0;justPressed['Escape']=false;}
    clearJP();return;
  }
  if(gameState==='select'){
    if(justPressed['ArrowLeft']||justPressed['KeyA'])selectIndex=0;
    if(justPressed['ArrowRight']||justPressed['KeyD'])selectIndex=1;
    if(selectIndex===0&&(justPressed['ArrowUp']||justPressed['KeyW'])){gigiSkin=(gigiSkin-1+GIGI_SKINS.length)%GIGI_SKINS.length;}
    if(selectIndex===0&&(justPressed['ArrowDown']||justPressed['KeyS'])){gigiSkin=(gigiSkin+1)%GIGI_SKINS.length;}
    if(justPressed['Space']||justPressed['Enter']){selectedChar=selectIndex===0?'gigi':'dodo';gameState='intro';introTimer=0;startBGM(BGM_INTRO);justPressed['Space']=false;justPressed['Enter']=false;}
    clearJP();return;
  }
  if(gameState==='intro'){introTimer++;if(introTimer>660||(introTimer>120&&(justPressed['Space']||justPressed['Enter']))){currentLevel=0;lives=DC().lives;score=0;initLevel(0);justPressed['Space']=false;justPressed['Enter']=false;}clearJP();return;}
  if(gameState==='dead'){stateTimer--;if(stateTimer<=0){if(lives>0)initLevel(currentLevel);else{gameState='gameover';stateTimer=180;startBGM(BGM_GAMEOVER);}}return;}
  if(gameState==='gameover'){stateTimer--;if(stateTimer<=0||justPressed['Space']){gameState='title';stopBGM();clearJP();}return;}
  if(gameState==='levelcomplete'){stateTimer--;if(stateTimer<=0){currentLevel++;if(currentLevel>=LEVELS.length){gameState='win';stateTimer=300;sfxWin();startBGM(BGM_WIN);}else{gameState='between';betweenTimer=0;}}return;}
  if(gameState==='between'){betweenTimer++;if(betweenTimer>480||(betweenTimer>120&&(justPressed['Space']||justPressed['Enter']))){initLevel(currentLevel);justPressed['Space']=false;justPressed['Enter']=false;}clearJP();return;}
  if(gameState==='win'){stateTimer--;if(stateTimer<=0||justPressed['Space']){gameState='title';stopBGM();clearJP();}return;}
  if(gameState!=='playing')return;

  const p=player, dc=DC(), lvl=LEVELS[currentLevel];

  updateShake();
  clearJP();
}

function playerHit(){const p=player,dc=DC(),iTime=dc.invincibleTime||60;if(p.hasCape){p.hasCape=false;p.invincible=iTime;p.vy=-4;spawnParticles(p.x+8,p.y+4,'#ff4400',10);playTone(400,.15,'sawtooth',.12,200);triggerShake(4,10);return;}playerDie();}
function playerDie(){lives--;gameState='dead';stateTimer=90;spawnParticles(player.x+6,player.y+8,'#ff3333',12);sfxHurt();stopBGM();triggerShake(5,12);}

// ==========================================
//  DRAW
// ==========================================
function draw(){
  const lvl=LEVELS[currentLevel];
  if(gameState==='debug'){ctx.fillStyle='#1a1a3a';ctx.fillRect(0,0,BASE_W,BASE_H);drawDebug();clearJP();return;}
  if(gameState==='title'){drawTitle();clearJP();return;}
  if(gameState==='modeselect'){drawModeSelect();clearJP();return;}
  if(gameState==='learnmenu'||gameState==='learnletters'||gameState==='learnsyllables'||gameState==='learnresult'){drawLearn();clearJP();return;}
  if(gameState==='intro'){drawIntro();clearJP();return;}
  if(gameState==='difficulty'){drawDifficulty();clearJP();return;}
  if(gameState==='select'){drawSelect();clearJP();return;}
  if(gameState==='between'){drawBetween();clearJP();return;}
  if(gameState==='gameover'){drawGameOver();clearJP();return;}
  if(gameState==='win'){drawWin();clearJP();return;}

  // Parallax background (replaces flat bg fill)
  drawParallax(currentLevel);

  // Clouds (float above parallax, gentle drift)
  if(lvl.clouds){ctx.fillStyle='rgba(255,255,255,0.5)';lvl.clouds.forEach(([cx,cy])=>{const sx=cx*TILE-camera.x*.15+Math.sin(animFrame*0.003+cx)*10,sy=cy*TILE+Math.sin(animFrame*0.006+cy)*4;
    ctx.beginPath();ctx.ellipse(sx+15,sy+8,22,12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(sx,sy+12,14,9,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(sx+30,sy+12,14,9,0,0,Math.PI*2);ctx.fill();});}

  // Apply screen shake offset
  ctx.save();ctx.translate(Math.round(screenShake.x),Math.round(screenShake.y));
  ctx.save();ctx.translate(-Math.round(camera.x),-Math.round(camera.y));
  const sTX=Math.floor(camera.x/TILE),eTX=Math.ceil((camera.x+BASE_W)/TILE),sTY=Math.floor(camera.y/TILE),eTY=Math.ceil((camera.y+BASE_H)/TILE);
  for(let ty=sTY;ty<=eTY;ty++) for(let tx=sTX;tx<=eTX;tx++){
    if(ty<0||ty>=lvl.height||tx<0||tx>=lvl.width)continue;const tile=map[ty][tx],dx=tx*TILE,dy=ty*TILE;
    if(tile===1){ctx.fillStyle=lvl.groundColor;ctx.fillRect(dx,dy,TILE,TILE);if(ty>0&&!isSolid(map[ty-1][tx])){ctx.fillStyle=lvl.groundTop||'#2d8a2d';ctx.fillRect(dx,dy,TILE,3);}}
    else if(tile===2){ctx.fillStyle=lvl.brickColor;ctx.fillRect(dx,dy,TILE,TILE);ctx.strokeStyle='#00000033';ctx.strokeRect(dx+.5,dy+.5,TILE-1,TILE-1);ctx.fillStyle='#00000022';ctx.fillRect(dx+7,dy,1,TILE);ctx.fillRect(dx,dy+7,TILE,1);}
    else if(tile===3){ctx.fillStyle='#ffcc00';ctx.fillRect(dx,dy,TILE,TILE);ctx.strokeStyle='#cc8800';ctx.strokeRect(dx+.5,dy+.5,TILE-1,TILE-1);ctx.fillStyle='#cc8800';ctx.font='10px monospace';ctx.fillText('?',dx+4,dy+12);}
    else if(tile===5){const rCol=`hsl(${(animFrame*3+tx*20)%360},100%,65%)`;ctx.fillStyle=rCol;ctx.fillRect(dx,dy,TILE,TILE);ctx.strokeStyle='#fff';ctx.strokeRect(dx+.5,dy+.5,TILE-1,TILE-1);ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.fillText('!',dx+6,dy+12);}
  }

  // Stars, pickups — with bob and sparkle
  stars.forEach(s=>{if(!s.collected){const b=Math.sin(animFrame*.12)*3;
    // Sparkle glow
    ctx.fillStyle='rgba(255,221,0,0.2)';ctx.beginPath();ctx.arc(s.x+5,s.y+5+b,8+Math.sin(animFrame*.15)*3,0,Math.PI*2);ctx.fill();
    drawSprite(STAR_S,s.x,s.y+b,STAR_P,1.5,false);
    // Occasional sparkle particle
    if(animFrame%20===Math.floor(s.x)%20){particles.push({x:s.x+3+Math.random()*6,y:s.y+b+Math.random()*6,vx:(Math.random()-0.5)*0.5,vy:-0.5-Math.random()*0.8,life:12+Math.random()*8,maxLife:20,color:'#ffee88',size:1+Math.random()});}}});
  bowPickups.forEach(b=>{if(b.collected)return;const bob=Math.sin(animFrame*.08+b.x*.1)*4;
    ctx.fillStyle='rgba(255,200,50,0.18)';ctx.beginPath();ctx.arc(b.x+8,b.y+8+bob,16+Math.sin(animFrame*.1)*3,0,Math.PI*2);ctx.fill();
    drawSprite(BOW_S,b.x,b.y+bob,BOW_P,2,false);
    if(animFrame%30===Math.floor(b.x)%30){particles.push({x:b.x+4+Math.random()*8,y:b.y+bob+Math.random()*8,vx:(Math.random()-0.5)*0.3,vy:-0.4-Math.random()*0.6,life:10+Math.random()*8,maxLife:18,color:'#ddaa44',size:1+Math.random()});}});
  superPickups.forEach(s=>{if(s.collected)return;const bob=Math.sin(animFrame*.07+s.x*.1)*5,r=18+Math.sin(animFrame*.09)*4;
    // Pulsing glow
    ctx.fillStyle='rgba(255,100,0,0.18)';ctx.beginPath();ctx.arc(s.x+8,s.y+8+bob,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,200,50,0.1)';ctx.beginPath();ctx.arc(s.x+8,s.y+8+bob,r*0.6,0,Math.PI*2);ctx.fill();
    drawSprite(SUPER_S,s.x,s.y+bob,SUPER_P,2,false);
    // Fire-like sparkles
    if(animFrame%12===Math.floor(s.x)%12){particles.push({x:s.x+4+Math.random()*8,y:s.y+bob+12,vx:(Math.random()-0.5)*0.8,vy:-1-Math.random()*1.5,life:10+Math.random()*6,maxLife:16,color:Math.random()>0.5?'#ff6600':'#ffaa00',size:1.5+Math.random()});}});
  // Cat pickup (uncollected) — with curious bounce
  if(catPickup&&!catPickup.collected){
    const bob=Math.sin(animFrame*.08+catPickup.x*.1)*4;
    ctx.fillStyle='rgba(100,100,180,0.2)';ctx.beginPath();ctx.arc(catPickup.x+8,catPickup.y+12+bob,20+Math.sin(animFrame*.1)*3,0,Math.PI*2);ctx.fill();
    drawSprite(CAT_S,catPickup.x,catPickup.y+bob,CAT_P,2,false);
    // Tail-swish sparkle
    if(animFrame%25===Math.floor(catPickup.x)%25){particles.push({x:catPickup.x+12+Math.random()*4,y:catPickup.y+bob+16,vx:(Math.random()-0.5)*0.6,vy:-0.3-Math.random()*0.5,life:12+Math.random()*6,maxLife:18,color:'#aabbee',size:1+Math.random()});}
  }
  // Cat companion (following player)
  if(cat){
    drawSprite(CAT_S,cat.x,cat.y,CAT_P,2,cat.facing<0);
    // Meow text occasionally
    if(animFrame%200<40){ctx.fillStyle='#aabbcc';ctx.font='bold 7px monospace';ctx.fillText(T('meow'),cat.x,cat.y-4);}
    // Scratch effect
    if(cat.scratchTimer>20&&cat.scratchTarget){
      drawSprite(CAT_SCRATCH_S,cat.scratchTarget.x-5,cat.scratchTarget.y-5,CAT_SCRATCH_P,2,false);
    }
  }

  // Rescue NPC — in cage on boss level, free otherwise
  const rsSpr=getRescueSprites(),rTX=lvl.rescuePos[0],rGY=findGroundY(rTX),rDH=spriteH(rsSpr.sprite,2),rX=rTX*TILE,rY=rGY-rDH;
  const isFinalLvl=(currentLevel===LEVELS.length-1);
  if(boss&&boss.alive&&isFinalLvl){
    // Sibling trapped in cage
    const cageW=40,cageH=50;
    const cageX=rX-8,cageY=rY-8;
    // Cage background
    ctx.fillStyle='rgba(50,40,30,0.3)';ctx.fillRect(cageX,cageY,cageW,cageH);
    // Sibling inside
    const bob=Math.sin(animFrame*.08)*2;
    drawSprite(rsSpr.sprite,rX,rY+bob,rsSpr.palette,2,false);
    // Cage bars
    ctx.strokeStyle='#888888';ctx.lineWidth=2;
    for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(cageX+i*10+2,cageY);ctx.lineTo(cageX+i*10+2,cageY+cageH);ctx.stroke();}
    ctx.strokeStyle='#999999';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cageX,cageY);ctx.lineTo(cageX+cageW,cageY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cageX,cageY+cageH);ctx.lineTo(cageX+cageW,cageY+cageH);ctx.stroke();
    // Sibling cry
    if(animFrame%80<50){ctx.fillStyle='#3388ff';ctx.font='bold 7px monospace';ctx.fillText(T('help_cry'),rX-2,rY-12);}
  } else if(!boss||bossDefeated){
    const bob=Math.sin(animFrame*.05)*2;drawSprite(rsSpr.sprite,rX,rY+bob,rsSpr.palette,2,false);
    if(animFrame%120<80){ctx.fillStyle='#ff69b4';ctx.font='bold 8px monospace';ctx.fillText(T('help_npc'),rX-2,rY-8);}
  }

  // Enemies
  enemies.forEach(e=>{if(!e.alive&&e.squashTimer<=0)return;ctx.globalAlpha=!e.alive?e.squashTimer/30:1;
    const info=getEnemySpriteInfo(e.type),fl=e.vx>0,wb=e.alive?Math.sin(animFrame*.15+e.x):0;
    if(e.type==='ghost'&&e.alive)ctx.globalAlpha=.6+Math.sin(animFrame*.08)*.2;
    if(!e.alive){ctx.save();ctx.translate(e.x,e.y+e.h*.7);ctx.scale(1,.3);drawSprite(info.sprite,0,0,info.palette,ENEMY_SCALE,fl);ctx.restore();}
    else drawSprite(info.sprite,e.x,e.y+wb,info.palette,ENEMY_SCALE,fl);
    if(e.type==='cannon'&&e.alive&&e.shootTimer>e.shootInterval-5){ctx.fillStyle='rgba(255,150,0,0.5)';const dir=player.x>e.x?1:-1;ctx.beginPath();ctx.arc(e.x+e.w/2+dir*10,e.y+e.h/2,5,0,Math.PI*2);ctx.fill();}
    if(e.stunTimer>0&&e.alive){ctx.fillStyle='#ffdd00';ctx.font='bold 10px monospace';ctx.fillText('*',e.x+e.w/4,e.y-2+Math.sin(animFrame*.2)*2);ctx.fillText('*',e.x+e.w*3/4,e.y-4+Math.cos(animFrame*.2)*2);}
    ctx.globalAlpha=1;});

  // Boss
  if(boss){
    if(boss.alive){
      const bfl=boss.facing>0;
      if(boss.hurtTimer>0&&boss.hurtTimer%4<2)ctx.globalAlpha=0.5;
      // Pick sprite frame based on state
      let bossSpr=BOSS_IDLE;
      let bWob=Math.sin(animFrame*.08)*2;
      if(boss.roarTimer&&boss.roarTimer>0){
        bossSpr=BOSS_ROAR;
        bWob=Math.sin(animFrame*.25)*3;
        // Roar shockwave rings
        if(animFrame%6===0){const rx=boss.x+boss.w/2+(bfl?20:-20),ry=boss.y+boss.h*.35;
          for(let i=0;i<3;i++)spawnParticles(rx+Math.random()*20-10,ry+Math.random()*10-5,'#ffaa44',1);}
      }else if(boss.charging){
        bossSpr=BOSS_CHARGE;
        bWob=Math.sin(animFrame*.4)*4;
        // Dust particles while charging
        if(animFrame%2===0)spawnParticles(boss.x+(bfl?0:boss.w),boss.y+boss.h,'#aa8866',3);
        // Ground shake effect
        if(animFrame%4===0)spawnParticles(boss.x+Math.random()*boss.w,boss.y+boss.h,'#665544',2);
      }else if(Math.abs(boss.vx)>0.1||boss.chargeTimer>120){
        bossSpr=boss.frame===0?BOSS_IDLE:BOSS_WALK;
        bWob=Math.sin(animFrame*.12)*2;
      }
      drawSprite(bossSpr,boss.x,boss.y+bWob,BOSS_P,4,bfl);
      // Angry eyes glow when low HP
      if(boss.hp<=boss.maxHp*.5){
        const glowI=0.2+Math.sin(animFrame*.15)*0.15;
        const glowR=boss.hp<=boss.maxHp*.25?8:5;
        ctx.fillStyle='rgba(255,50,0,'+glowI+')';
        ctx.beginPath();ctx.arc(boss.x+(bfl?boss.w*.65:boss.w*.35),boss.y+bWob+boss.h*.22,glowR,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(boss.x+(bfl?boss.w*.55:boss.w*.45),boss.y+bWob+boss.h*.22,glowR,0,Math.PI*2);ctx.fill();
      }
      // Scar marks when damaged
      if(boss.hp<boss.maxHp*.75){
        ctx.strokeStyle='rgba(100,40,20,0.4)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(boss.x+boss.w*.3,boss.y+bWob+boss.h*.5);ctx.lineTo(boss.x+boss.w*.4,boss.y+bWob+boss.h*.6);ctx.stroke();
      }
      ctx.globalAlpha=1;
      // Health bar
      const hbW=boss.w,hbH=6,hbX=boss.x,hbY=boss.y-12;
      ctx.fillStyle='#330000';ctx.fillRect(hbX,hbY,hbW,hbH);
      ctx.fillStyle=boss.hp>boss.maxHp*.5?'#44cc44':boss.hp>boss.maxHp*.25?'#cccc44':'#cc4444';
      ctx.fillRect(hbX+1,hbY+1,(hbW-2)*(boss.hp/boss.maxHp),hbH-2);
      ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(hbX,hbY,hbW,hbH);
      // Boss taunt
      if(animFrame%180<100){
        const phrases=T('boss_taunt');
        const pi=Math.floor(animFrame/180)%phrases.length;
        ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';
        ctx.fillText(phrases[pi],boss.x+boss.w/2,boss.y-18);ctx.textAlign='left';
      }
    } else if(bossDefeated){
      // Defeated explosion particles
      if(animFrame%8===0)spawnParticles(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,'#ffaa00',3);
    }
  }

  // Enemy projectiles
  enemyProjectiles.forEach(ep=>{const f=Math.sin(animFrame*.3+ep.x)*.3;ctx.globalAlpha=.8+f*.2;drawSprite(FIREBALL_S,ep.x,ep.y,FIREBALL_P,2,false);ctx.fillStyle='rgba(255,100,0,0.3)';ctx.fillRect(ep.vx>0?ep.x-4:ep.x+10,ep.y+2,4,4);ctx.globalAlpha=1;});

  // Arrows
  arrows.forEach(a=>{
    if(a.isChicken){drawSprite(CHICKEN_S,a.x,a.y-4,CHICKEN_P,1.5,a.vx<0);ctx.fillStyle='rgba(255,255,100,0.3)';ctx.fillRect(a.vx>0?a.x-4:a.x+12,a.y,4,3);}
    else{drawSprite(ARROW_S,a.x,a.y,ARROW_P,2,a.vx<0);ctx.fillStyle='rgba(255,200,100,0.4)';ctx.fillRect(a.vx>0?a.x-6:a.x+14,a.y+1,6,2);}
  });

  // Player
  const p=player;
  if(p.invincible<=0||Math.floor(animFrame/3)%2===0){const ps=getPlayerSprites();let spr;if(p.frame===0)spr=ps.stand;else if(p.frame===1)spr=ps.run;else spr=ps.jump;
    if(p.hasCape){const cx=p.facing>0?p.x-8:p.x+p.w-4,cw=Math.sin(animFrame*.15)*2;drawSprite(CAPE_S,cx,p.y+6+cw,CAPE_P,2,p.facing<0);}
    if(p.bigHeadTimer>0){
      // Split the sprite: body at normal scale, head blown up on top
      const headH=Math.floor(spr.length*0.5),headData=spr.slice(0,headH),bodyData=spr.slice(headH);
      const bw=spr[0].length,headScale=5,bodyX=p.x-2,bodyY=p.y-2+headH*2;
      drawSprite(bodyData,bodyX,bodyY,ps.palette,2,p.facing<0);
      const headW=bw*headScale,bodyW=bw*2,headX=bodyX+(bodyW-headW)/2,headY=bodyY-headH*headScale;
      drawSprite(headData,headX,headY,ps.palette,headScale,p.facing<0);
    }
    else drawSprite(spr,p.x-2,p.y-2,ps.palette,2,p.facing<0);}

  particles.forEach(pt=>{const a=pt.life/(pt.maxLife||40);ctx.fillStyle=pt.color;ctx.globalAlpha=a*a;const s=pt.size||3;ctx.beginPath();ctx.arc(pt.x,pt.y,s*a,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  ctx.restore(); // camera
  ctx.restore(); // screen shake

  // HUD
  if(lives===Infinity){drawSprite(HEART_S,8,8,HEART_P,2,false);ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('∞',28,22);}
  else{for(let i=0;i<lives;i++)drawSprite(HEART_S,8+i*18,8,HEART_P,2,false);}
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText(T('score')+score,BASE_W-140,22);
  const lvlNames=['level_1','level_2','level_3','level_4','level_5','level_6'];
  ctx.fillStyle='#ffffffaa';ctx.font='10px monospace';ctx.fillText(T(lvlNames[currentLevel])+' ['+TDiff(selectedDifficulty)+']',BASE_W/2-60,16);
  let hx=BASE_W-40;if(cat&&cat.hitsLeft>0){drawSprite(CAT_S,hx,30,CAT_P,1.5,false);ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.fillText('x'+cat.hitsLeft,hx+2,48);hx-=22;}
  if(p.hasCape){drawSprite(SUPER_S,hx,32,SUPER_P,1.5,false);hx-=22;}
  if(p.hasBow){drawSprite(BOW_S,hx,32,BOW_P,1.5,false);ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.fillText('x'+p.bowCharges,hx+2,50);}
  // Power-up icons — left side, below the hearts
  let hudY=44;
  if(p.fartTimer>0){ctx.font='14px serif';ctx.fillText('\ud83d\udca8',8,hudY);ctx.fillStyle='#88cc44';ctx.font='bold 10px monospace';ctx.fillText(Math.ceil(p.fartTimer/60)+'s',26,hudY);hudY+=16;}
  if(p.bigHeadTimer>0){ctx.font='14px serif';ctx.fillText('\ud83e\udd2a',8,hudY);ctx.fillStyle='#ff69b4';ctx.font='bold 10px monospace';ctx.fillText(Math.ceil(p.bigHeadTimer/60)+'s',26,hudY);hudY+=16;}
  if(p.chickenRayCharges>0){ctx.font='14px serif';ctx.fillText('\ud83d\udc14',8,hudY);ctx.fillStyle='#ffffff';ctx.font='bold 10px monospace';ctx.fillText('x'+p.chickenRayCharges,26,hudY);hudY+=16;}
  // Animated viewport border while a power-up is active
  if(p.fartTimer>0||p.bigHeadTimer>0||p.chickenRayCharges>0){
    ctx.save();
    const bw=4,af=animFrame;
    const pColor=p.fartTimer>0?'#88cc44':p.bigHeadTimer>0?'#ff69b4':'#ffdd00';
    ctx.globalAlpha=0.3+Math.sin(af*0.1)*0.15;
    ctx.strokeStyle=pColor;ctx.lineWidth=bw;ctx.setLineDash([8,6]);ctx.lineDashOffset=-af*2;
    ctx.strokeRect(bw/2,bw/2,BASE_W-bw,BASE_H-bw);
    ctx.setLineDash([]);
    const glow=6+Math.sin(af*0.15)*3;
    [[0,0],[BASE_W,0],[0,BASE_H],[BASE_W,BASE_H]].forEach(([cx,cy])=>{
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,glow*3);
      g.addColorStop(0,pColor);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.fillRect(cx-glow*3,cy-glow*3,glow*6,glow*6);
    });
    ctx.restore();
  }
  // Boss HUD
  if(boss&&boss.alive){
    const bHW=120,bHH=10,bHX=BASE_W/2-bHW/2,bHY=BASE_H-22;
    ctx.fillStyle='#330000';ctx.fillRect(bHX,bHY,bHW,bHH);
    ctx.fillStyle=boss.hp>boss.maxHp*.5?'#44cc44':boss.hp>boss.maxHp*.25?'#cccc44':'#cc4444';
    ctx.fillRect(bHX+1,bHY+1,(bHW-2)*(boss.hp/boss.maxHp),bHH-2);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(bHX,bHY,bHW,bHH);
    ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText('BOSS',BASE_W/2,bHY-3);ctx.textAlign='left';
  }
  if(boss&&bossDefeated&&animFrame%60<40){
    ctx.fillStyle='#ffdd00';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(T('boss_defeated'),BASE_W/2,BASE_H/2-30);ctx.textAlign='left';
  }

  if(gameState==='levelcomplete'){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,BASE_W,BASE_H);ctx.fillStyle='#ff69b4';ctx.font='bold 24px monospace';ctx.textAlign='center';ctx.fillText(getRescueSprites().name.toUpperCase()+T('is_safe'),BASE_W/2,BASE_H/2-10);ctx.fillStyle='#fff';ctx.font='14px monospace';ctx.fillText(currentLevel<LEVELS.length-1?T('next_world'):T('you_did_it'),BASE_W/2,BASE_H/2+20);ctx.textAlign='left';}
  if(gameState==='dead'){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,BASE_W,BASE_H);ctx.fillStyle='#ff3333';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(T('oops'),BASE_W/2,BASE_H/2);ctx.textAlign='left';}
}

// ==========================================
//  SCREENS
// ==========================================
function drawTitle(){

function drawIntro(){
  const t=introTimer;
  // Get hero and stolen sibling based on selection
  const ps=getPlayerSprites(), rs=getRescueSprites();
  const heroName=selectedChar==='gigi'?'GIGI':'DODO';
  const sibName=rs.name.toUpperCase();
  const heroStand=ps.stand, heroRun=ps.run, heroPal=ps.palette;
  const sibStand=rs.sprite, sibPal=rs.palette;
  const sibJump=selectedChar==='gigi'?DODO_JUMP:GIGI_JUMP;

  // Scene background - park
  ctx.fillStyle='#88ccff';ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.fillStyle='#44aa44';ctx.fillRect(0,BASE_H-80,BASE_W,80);ctx.fillStyle='#2d8a2d';ctx.fillRect(0,BASE_H-80,BASE_W,4);

  ctx.fillStyle='#ffee55';ctx.beginPath();ctx.arc(BASE_W-70,60,30,0,Math.PI*2);ctx.fill();
  // Clouds
  ctx.fillStyle='rgba(255,255,255,0.7)';
  [60,220,420].forEach((cx,i)=>{const cy=40+i*12;ctx.beginPath();ctx.ellipse(cx,cy,30,16,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx-18,cy+8,15,10,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx+18,cy+8,15,10,0,0,Math.PI*2);ctx.fill();});

  const heroX=180,heroY=BASE_H-80-spriteH(heroStand,3);
  const sibX=260,sibY=BASE_H-80-spriteH(sibStand,3);

  // Phase 1: Both playing (t 0-200)
  if(t<200){
    const gb=Math.sin(t*.1)*3;

  }

  // Phase 2: Enemy stomps in (t 170-359) — rotating kidnapper
  const ik=getKidnapper(0);
  if(t>=170&&t<360){
    const dinoEnterX=t<290?BASE_W+20-(t-170)*3:BASE_W+20-120*3;
    const dinoX=Math.max(sibX+20,dinoEnterX);
    const dinoY=BASE_H-80-spriteH(ik.s,4);
    drawSprite(ik.s,dinoX,dinoY+(t>=290?Math.sin(t*.3)*2:0),ik.p,4,true);
    // Speech bubble
    if(t>=250){
      const bubX=dinoX-10,bubY=dinoY-40;
      ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(bubX,bubY);ctx.lineTo(bubX+140,bubY);ctx.lineTo(bubX+140,bubY+30);ctx.lineTo(bubX+30,bubY+30);ctx.lineTo(bubX+20,bubY+40);ctx.lineTo(bubX+15,bubY+30);ctx.lineTo(bubX,bubY+30);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle=ik.color;ctx.font='bold 10px monospace';ctx.textAlign='center';
      const phrases=T('dino_phrases');
      const pi=Math.floor((t-250)/40)%phrases.length;
      ctx.fillText(phrases[pi],bubX+70,bubY+18);
      ctx.textAlign='left';
    }
  }

  // Sibling and hero standing during dino approach
  if(t>=200&&t<360){
    drawSprite(sibStand,sibX,sibY,sibPal,3,false);
    if(t>=230){ctx.fillStyle='#ff3333';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('???',sibX+15,sibY-10);ctx.textAlign='left';}
    const gb2=Math.sin(t*.15)*2;drawSprite(heroStand,heroX,heroY+gb2,heroPal,3,false);
  }

  // Phase 3: Enemy grabs sibling and runs (t 360+)
  if(t>=360){
    const runX=sibX+20+(t-360)*3;
    const dinoRunY=BASE_H-80-spriteH(ik.s,4);
    const bounce=Math.abs(Math.sin(t*.15))*4;

    if((t-360)%30<20){ctx.fillStyle='#3388ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(T('help_cry'),runX+20,dinoRunY-spriteH(sibStand,2)-5);ctx.textAlign='left';}
    // Hero reacts
    drawSprite(heroStand,heroX,heroY,heroPal,3,false);
    if(t<480){ctx.fillStyle='#ff3333';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(sibName+'!!!',heroX+15,heroY-15);ctx.textAlign='left';}
    else{ctx.fillStyle='#ffdd00';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(T('i_come_help'),heroX+15,heroY-15);ctx.textAlign='left';}

  // Dramatic rotating headline
  if(t>=420){
    ctx.save();
    ctx.translate(BASE_W/2,BASE_H/2-40);

    ctx.rotate(rot);ctx.scale(scale,scale);
    ctx.fillStyle='#ff3333';ctx.font='bold 32px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='#000';ctx.lineWidth=3;
    const headline=T('save_sib')+' '+sibName+'!';
    ctx.strokeText(headline,0,0);ctx.fillText(headline,0,0);
    ctx.fillStyle='#ffdd00';ctx.font='bold 16px monospace';
    const sub=T('adventure_begins');
    ctx.strokeText(sub,0,35);ctx.fillText(sub,0,35);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.restore();
  }

  // Skip hint
  if(t>90){
    const a=.3+Math.sin(t*.06)*.2;ctx.globalAlpha=a;
    ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(T('press_space'),BASE_W/2,BASE_H-10);
    ctx.textAlign='left';ctx.globalAlpha=1;
  }
}

function drawBetween(){
  const t=betweenTimer;
  const ps=getPlayerSprites(), rs=getRescueSprites();
  const sibName=rs.name.toUpperCase();
  const heroStand=ps.stand, heroRun=ps.run, heroPal=ps.palette;
  const sibStand=rs.sprite, sibPal=rs.palette;
  const sibJump=selectedChar==='gigi'?DODO_JUMP:GIGI_JUMP;
  const isBossLevel=(currentLevel===LEVELS.length-1);

  // Background - next level preview colors
  const nextLvl=LEVELS[currentLevel];

  if(isBossLevel){
    // === SPECIAL BOSS INTRO ===
    // Dark, dramatic scene — the ground shakes, boss emerges from shadows
    const shake=t>120&&t<200?Math.sin(t*1.2)*3:0;
    ctx.save();ctx.translate(shake,0);

    // Dark stormy sky
    const skyDark=Math.min(1,t/60);
    ctx.fillStyle='#'+Math.floor(0x33-0x22*skyDark).toString(16).padStart(2,'0')+Math.floor(0x22-0x11*skyDark).toString(16).padStart(2,'0')+Math.floor(0x44-0x22*skyDark).toString(16).padStart(2,'0');
    ctx.fillRect(0,0,BASE_W,BASE_H);
    // Ground
    ctx.fillStyle=nextLvl?nextLvl.groundColor:'#553322';ctx.fillRect(0,BASE_H-70,BASE_W,70);

    // Lightning flashes
    if(t>60&&t<200&&t%40<3){ctx.fillStyle='rgba(255,255,200,0.3)';ctx.fillRect(0,0,BASE_W,BASE_H);}

    // Storm clouds
    ctx.fillStyle='rgba(40,30,50,0.8)';
    [60,180,320,460,560].forEach((cx,i)=>{const cy=30+i*8+Math.sin(t*.02+i)*5;
      ctx.beginPath();ctx.ellipse(cx,cy,50,20,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx-25,cy+10,30,15,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+25,cy+10,30,15,0,0,Math.PI*2);ctx.fill();
    });

    const heroX=80, heroY=BASE_H-70-spriteH(heroStand,3);

    // Phase 1 (0-100): Hero walks forward determined
    if(t<100){
      const walkX=heroX-40+t*.8;
      const bob=Math.sin(t*.2)*2;
      drawSprite(t%20<10?heroStand:heroRun,walkX,heroY+bob,heroPal,3,false);
      // Determined text
      if(t>40){
        ctx.fillStyle='#ffdd00';ctx.font='bold 11px monospace';ctx.textAlign='center';
        ctx.fillText(T('almost_there'),walkX+15,heroY-12);ctx.textAlign='left';
      }
    }

    // Phase 2 (100-200): Ground shakes, hero stops
    if(t>=100&&t<200){
      drawSprite(heroStand,heroX+40,heroY,heroPal,3,false);
      if(t>130){
        ctx.fillStyle='#ff4444';ctx.font='bold 12px monospace';ctx.textAlign='center';
        ctx.fillText('...?!',heroX+55,heroY-12);ctx.textAlign='left';
      }
      // Rumble particles from ground
      if(t%4===0){
        const rx=BASE_W*0.6+Math.random()*100;
        spawnParticles(rx,BASE_H-70,'#886655',2);
      }
    }

    // Phase 3 (200+): Boss dramatically appears from the right
    if(t>=200){
      // Hero stands scared
      drawSprite(heroStand,heroX+40,heroY,heroPal,3,false);
      if(t<300){
        ctx.fillStyle='#ff3333';ctx.font='bold 13px monospace';ctx.textAlign='center';
        ctx.fillText('!!!',heroX+55,heroY-12);ctx.textAlign='left';
      }

      // Boss enters from right — big and slow
      const bossEnterT=t-200;
      const bossTargetX=BASE_W*0.55;
      const bossX=bossEnterT<120?BASE_W+30-bossEnterT*2.5:bossTargetX;
      const bossY=BASE_H-70-spriteH(BOSS_IDLE,4);
      const bBounce=Math.abs(Math.sin(t*.08))*3;

      // Shadow underneath
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.beginPath();ctx.ellipse(bossX+spriteW(BOSS_IDLE,4)/2,BASE_H-68,40,8,0,0,Math.PI*2);ctx.fill();

      // Draw boss — use roar frame when arrived
      const bSpr=bossEnterT<120?BOSS_WALK:(bossEnterT%80<40?BOSS_ROAR:BOSS_IDLE);
      drawSprite(bSpr,bossX,bossY+bBounce,BOSS_P,4,true);

      // Boss speech bubble
      if(bossEnterT>=120){
        const bubX=bossX-160,bubY=bossY-45;
        ctx.fillStyle='#331111';ctx.strokeStyle='#ff3333';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(bubX,bubY);ctx.lineTo(bubX+155,bubY);ctx.lineTo(bubX+155,bubY+35);ctx.lineTo(bubX+140,bubY+35);ctx.lineTo(bubX+155,bubY+48);ctx.lineTo(bubX+130,bubY+35);ctx.lineTo(bubX,bubY+35);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='#ff4444';ctx.font='bold 10px monospace';ctx.textAlign='center';
        const bossPhrases=T('boss_intro_phrases');
        const pi=Math.floor((bossEnterT-120)/60)%bossPhrases.length;
        ctx.fillText(bossPhrases[pi],bubX+78,bubY+22);ctx.textAlign='left';
      }

      // Sibling trapped in cage on the far right
      if(bossEnterT>=80){
        const cageX=BASE_W-80, cageY=BASE_H-70-50;
        // Cage bars
        ctx.strokeStyle='#888';ctx.lineWidth=2;
        for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(cageX+i*12,cageY);ctx.lineTo(cageX+i*12,cageY+44);ctx.stroke();}
        ctx.beginPath();ctx.moveTo(cageX-2,cageY);ctx.lineTo(cageX+50,cageY);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cageX-2,cageY+44);ctx.lineTo(cageX+50,cageY+44);ctx.stroke();
        // Sibling inside

      }

      if(grabT>50){
        ctx.fillStyle='#ff3333';ctx.font='bold 14px monospace';ctx.textAlign='center';

      }

    // Big text
    if(t>=220){

      const scale=Math.min(1,(t-220)/25);
      const rot=Math.sin(t*.03)*.1;
      ctx.rotate(rot);ctx.scale(scale,scale);
      ctx.strokeStyle='#000';ctx.lineWidth=3;
      ctx.fillStyle='#ff3333';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeText(sibName+T('sib_stolen_again'),0,0);
      ctx.fillText(sibName+T('sib_stolen_again'),0,0);
      ctx.fillStyle='#ffdd00';ctx.font='bold 16px monospace';
      const lvlNames=['level_1','level_2','level_3','level_4','level_5','level_6'];

      ctx.fillText(T('keep_going')+' \u2192 '+nextName,0,35);
      ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.restore();
    }
  }

  // Skip hint
  if(t>60){
    const a=.3+Math.sin(t*.06)*.2;ctx.globalAlpha=a;
    ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(T('press_space'),BASE_W/2,BASE_H-10);
    ctx.textAlign='left';ctx.globalAlpha=1;
  }
}

// ==========================================
//  LEARN MODE — Tower Climb with Letter Gates
// ==========================================
let learnMenuIdx=0;
const LEARN_LETTERS=['A','E','I','O','U','M','N','S','K','T','L','P','R','J','V','H','Ä','Ö','Ü','Õ'];
const LEARN_SYLLABLES=['MA','PA','SA','KA','TA','LA','NA','ME','SE','KE','TE','LE','MI','SI','KI','TI','MO','KO','TO','MU','KU','TU','LU'];
const LEARN_WORDS=['KASS','KOER','MAJA','PALL','KALA','LUMI','AUTO','MUNA','PAAT','SUUR'];

// Tower tuning. GATE_GAP must sit strictly between a normal jump's rise and a
// rocket's rise — the self-tests below assert exactly that.
// GATES_PER_TOWER, GATE_RISE and GATE_GAP are consumed by the tower builder,
// and LEARN_ROCKET by the correct-answer launch. Until those land, the
// self-tests are their only reader — they are scaffolding, not dead code.
const GATES_PER_TOWER=4;
const STEP_RISE=45;      // vertical gap between stepping platforms
const GATE_RISE=50;      // last step up to the gate floor
const GATE_GAP=132;      // gate floor up to the landing floor above it
const LEARN_JUMP=-9.0;   // normal jump impulse
const LEARN_ROCKET=-11.0;// correct-answer launch impulse

let learn={
  mode:'letters', // 'letters','syllables','words'
  platforms:[],gates:[],
  px:0,py:0,pvx:0,pvy:0,pFacing:1,pFrame:0,pFrameTimer:0,pOnGround:false,
  rocketing:false,
  pCoyote:0,pJumpBuf:0,
  camY:0,
  score:0,round:0,totalRounds:8,
  feedback:null, // {type:'correct'|'wrong',timer,x,y,text}
  celebration:0,
  usedItems:[], // track which letters/syllables used this session
  currentTarget:'', // what to find
  gateIdx:0,
  wordProgress:0, // for word mode: which letter of the word we're on
  finished:false,
  particles:[]
};

function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pickDistractors(correct,pool,count){
  const distractors=[];
  const available=pool.filter(x=>x!==correct);
  const shuffled=shuffleArray(available);
  for(let i=0;i<count&&i<shuffled.length;i++)distractors.push(shuffled[i]);
  return distractors;
}

function initLearnRound(){
  const L=learn;
  L.platforms=[];L.gates=[];L.particles=[];
  L.px=BASE_W/2-10;L.py=0;L.pvx=0;L.pvy=0;L.pOnGround=false;
  L.pCoyote=0;L.pJumpBuf=0;
  L.camY=0;L.feedback=null;L.celebration=0;L.gateIdx=0;L.wordProgress=0;L.finished=false;

  // Pick target based on mode
  let pool,target;
  if(L.mode==='letters'){
    pool=LEARN_LETTERS;
    const unused=pool.filter(x=>!L.usedItems.includes(x));
    const pick=unused.length>0?unused:pool;
    target=pick[Math.floor(Math.random()*pick.length)];
    L.usedItems.push(target);
  } else if(L.mode==='syllables'){
    pool=LEARN_SYLLABLES;
    const unused=pool.filter(x=>!L.usedItems.includes(x));
    const pick=unused.length>0?unused:pool;
    target=pick[Math.floor(Math.random()*pick.length)];
    L.usedItems.push(target);
  } else {
    pool=LEARN_WORDS;
    const unused=pool.filter(x=>!L.usedItems.includes(x));
    const pick=unused.length>0?unused:pool;
    target=pick[Math.floor(Math.random()*pick.length)];
    L.usedItems.push(target);
  }
  L.currentTarget=target;

  // Build tower: platforms going UP (negative Y = higher)
  // Each platform stays within reachable jump distance of the previous one
  const startY=50;
  L.py=startY-30;L.px=BASE_W/2-10;
  const startPW=140;
  L.platforms.push({x:BASE_W/2-startPW/2,y:startY,w:startPW});

  let curY=startY;
  let lastPx=BASE_W/2; // track center of last platform for reachability
  const MAX_HOP=100; // max horizontal distance between platform centers (jump range ~126px, minus half-widths)
  function nextPlatX(pw){
    // Keep new platform center within MAX_HOP of last, clamped to screen
    const minCx=Math.max(pw/2+10, lastPx-MAX_HOP);
    const maxCx=Math.min(BASE_W-pw/2-10, lastPx+MAX_HOP);
    const cx=minCx+Math.random()*Math.max(0,maxCx-minCx);
    lastPx=cx;
    return cx-pw/2;
  }
  // The step right under a gate is a centred launch pad: from there every
  // answer is the same short hop away, so no answer is ever out of reach
  // and none is given away by being the closest.
  function launchPadX(pw){lastPx=BASE_W/2;return lastPx-pw/2;}

  if(L.mode==='words'){
    // For words: one gate per letter
    const letters=target.split('');
    for(let i=0;i<letters.length;i++){
      // Stepping platforms between gates
      for(let j=0;j<3;j++){
        // the first step after a gate is placed high enough that it cannot be
        // reached from the launch pad below the gate — the gate can't be skipped
        curY-=(j===0&&i>0)?65:45;
        const pw=100+Math.random()*30;
        const px=j===2?launchPadX(pw):nextPlatX(pw);
        L.platforms.push({x:px,y:curY,w:pw});
      }
      // Gate
      curY-=50;
      lastPx=BASE_W/2; // gates span full width, reset tracking
      const correctLetter=letters[i];
      const distractors=pickDistractors(correctLetter,LEARN_LETTERS,2);
      const options=shuffleArray([correctLetter,...distractors]);
      const gateW=120,gateGap=(BASE_W-gateW*3)/4;
      const gatePlatforms=options.map((letter,idx)=>({
        letter,x:gateGap+(gateGap+gateW)*idx,y:curY,w:gateW,
        correct:letter===correctLetter,hit:false,wrongTimer:0
      }));
      L.gates.push({y:curY,options:gatePlatforms,solved:false,target:correctLetter,wordIdx:i});
    }
  } else {
    // For letters/syllables: single gate challenge
    // Several stepping platforms, then one gate
    for(let j=0;j<4;j++){
      curY-=45;
      const pw=100+Math.random()*30;
      const px=j===3?launchPadX(pw):nextPlatX(pw);
      L.platforms.push({x:px,y:curY,w:pw});
    }
    curY-=50;
    lastPx=BASE_W/2; // gates span full width
    const correct=target;
    const distractorPool=L.mode==='letters'?LEARN_LETTERS:LEARN_SYLLABLES;
    const distractors=pickDistractors(correct,distractorPool,2);
    const options=shuffleArray([correct,...distractors]);
    const gateW=L.mode==='syllables'?140:120,gateGap=(BASE_W-gateW*3)/4;
    const gatePlatforms=options.map((letter,idx)=>({
      letter,x:gateGap+(gateGap+gateW)*idx,y:curY,w:gateW,
      correct:letter===correct,hit:false,wrongTimer:0
    }));
    L.gates.push({y:curY,options:gatePlatforms,solved:false,target:correct});
  }

  // Final platform above last gate — 65px so a full jump from the launch pad
  // below the gate lands on the answers, not past them onto the star
  curY-=65;
  L.platforms.push({x:BASE_W/2-90,y:curY,w:180,isFinish:true});
  // Star at finish
  L.finishY=curY;

  // Initialize camera so player is near bottom of screen, can see upward
  L.camY=L.py-BASE_H*0.45;
}

// One frame of vertical motion for the learn-mode player. Shared with the
// self-tests so the asserted jump heights describe real behaviour.
// `rocketing` suppresses the variable-height jump-cut: without it a child who
// taps rather than holds jump rises 19px instead of 158px and is trapped below
// a gate they answered correctly.
// When a rocket launch stops being exempt from the jump-cut: at the apex.
// Shared with the self-tests for the same reason learnVertStep is — if the
// game and the harness disagreed about when the exemption ends, the asserted
// rocket heights would stop describing what the player actually gets.
function rocketSpent(vy,rocketing){return rocketing&&vy>=0;}

function learnVertStep(vy,holdJump,rocketing,onGround){
  if(!holdJump&&!rocketing&&vy<-3.6)vy=-3.6;
  const apex=Math.abs(vy)<2.0&&!onGround;
  const gm=vy>0?1.1:(apex?0.5:1.0);
  vy+=0.38*gm;
  return vy>7?7:vy;
}

function updateLearn(){
  animFrame++;
  if(justPressed['KeyL']){lang=lang==='et'?'en':'et';justPressed['KeyL']=false;}

  if(gameState==='learnmenu'){
    if(justPressed['ArrowLeft']||justPressed['KeyA'])learnMenuIdx=Math.max(0,learnMenuIdx-1);
    if(justPressed['ArrowRight']||justPressed['KeyD'])learnMenuIdx=Math.min(2,learnMenuIdx+1);
    if(justPressed['Space']||justPressed['Enter']){
      learn.mode=['letters','syllables','words'][learnMenuIdx];
      learn.round=0;learn.score=0;learn.usedItems=[];
      initLearnRound();
      gameState='learnletters';
      justPressed['Space']=false;justPressed['Enter']=false;
    }
    if(justPressed['Escape']){gameState='modeselect';modeIndex=1;justPressed['Escape']=false;}
    clearJP();return;
  }

  if(gameState==='learnresult'){
    if(justPressed['Space']||justPressed['Enter']){
      learn.round++;
      if(learn.round>=learn.totalRounds){
        gameState='learnmenu';
        justPressed['Space']=false;justPressed['Enter']=false;
      } else {
        initLearnRound();
        gameState='learnletters';
        justPressed['Space']=false;justPressed['Enter']=false;
      }
    }
    if(justPressed['Escape']){gameState='learnmenu';justPressed['Escape']=false;}
    clearJP();return;
  }

  // === TOWER CLIMB GAMEPLAY ===
  const L=learn,p=L;
  if(L.celebration>0){L.celebration--;if(L.celebration<=0&&L.finished){gameState='learnresult';}clearJP();return;}
  if(L.feedback&&L.feedback.timer>0){L.feedback.timer--;}

  // Movement — generous for kids
  const grndAcc=0.8,airAcc=0.55,grndDec=0.7,airDec=0.88;
  const acc=L.pOnGround?grndAcc:airAcc;
  const dec=L.pOnGround?grndDec:airDec;
  const spd=3.5;
  if(keys['ArrowLeft']||keys['KeyA']){L.pvx=Math.max(L.pvx-acc,-spd);L.pFacing=-1;}
  else if(keys['ArrowRight']||keys['KeyD']){L.pvx=Math.min(L.pvx+acc,spd);L.pFacing=1;}
  else{L.pvx*=dec;if(Math.abs(L.pvx)<0.12)L.pvx=0;}

  // Coyote + buffer — extra generous for kids
  if(L.pOnGround){L.pCoyote=10;}else{if(L.pCoyote>0)L.pCoyote--;}
  const jk=keys['Space']||keys['ArrowUp']||keys['KeyW'];
  const jj=justPressed['Space']||justPressed['ArrowUp']||justPressed['KeyW'];
  if(jj)L.pJumpBuf=12;
  if(L.pJumpBuf>0)L.pJumpBuf--;
  if((L.pOnGround||L.pCoyote>0)&&L.pJumpBuf>0){L.pvy=LEARN_JUMP;L.pOnGround=false;L.pCoyote=0;L.pJumpBuf=0;sfxJump();}

  L.pvy=learnVertStep(L.pvy,jk,L.rocketing,L.pOnGround);
  if(rocketSpent(L.pvy,L.rocketing))L.rocketing=false;

  L.px+=L.pvx;
  // Wrap horizontally
  if(L.px<-10)L.px=BASE_W-10;
  if(L.px>BASE_W)L.px=-10;

  L.py+=L.pvy;
  L.pOnGround=false;

  // Collide with regular platforms (only when falling)
  if(L.pvy>=0){
    const pw=16,ph=24;
    L.platforms.forEach(pl=>{
      if(L.px+pw>pl.x&&L.px<pl.x+pl.w&&L.py+ph>=pl.y&&L.py+ph<=pl.y+12){
        L.py=pl.y-ph;L.pvy=0;L.pOnGround=true;
        if(pl.isFinish&&!L.finished){
          // Check all gates solved
          const allSolved=L.gates.every(g=>g.solved);
          if(allSolved){
            L.finished=true;L.celebration=90;L.score+=100;
            sfxWin();
            for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
              L.particles.push({x:L.px+8,y:L.py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:40+Math.random()*20,maxLife:60,color:['#ffdd00','#ff69b4','#88ff88','#88ccff'][i%4],size:2+Math.random()*2});}
          }
        }
      }
    });
    // Collide with gate platforms
    L.gates.forEach(gate=>{
      gate.options.forEach(opt=>{
        if(opt.wrongTimer>0){opt.wrongTimer--;return;}
        if(L.px+16>opt.x&&L.px<opt.x+opt.w&&L.py+24>=opt.y&&L.py+24<=opt.y+12){
          if(opt.correct&&!gate.solved){
            // CORRECT!
            gate.solved=true;opt.hit=true;
            L.pvy=-6;L.pOnGround=false;
            L.feedback={type:'correct',timer:40,x:opt.x+opt.w/2,y:opt.y-20,text:opt.letter};
            L.score+=50;
            sfxCoin();
            for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*2;
              L.particles.push({x:opt.x+opt.w/2,y:opt.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:25+Math.random()*15,maxLife:40,color:'#88ff88',size:2+Math.random()*2});}
          } else if(!opt.correct&&!gate.solved){
            // WRONG — bounce down gently
            opt.wrongTimer=30;
            L.pvy=-4;L.pOnGround=false;
            L.feedback={type:'wrong',timer:30,x:opt.x+opt.w/2,y:opt.y-20,text:'✗'};
            playTone(150,.15,'triangle',.08,100);
            for(let i=0;i<5;i++){L.particles.push({x:opt.x+opt.w/2,y:opt.y,vx:(Math.random()-0.5)*2,vy:-1-Math.random(),life:15,maxLife:15,color:'#ff6666',size:1.5+Math.random()});}
          } else if(gate.solved){
            // Already solved, just land
            L.py=opt.y-24;L.pvy=0;L.pOnGround=true;
          }
        }
      });
    });
  }

  // Fall too far down = reset to last safe platform.
  // The tower is built upward, so y gets SMALLER the higher you go:
  // the checkpoint is the highest solved gate (or the start), and falling
  // means py grows past it.
  let safeY=50;
  L.gates.forEach(g=>{if(g.solved)safeY=Math.min(safeY,g.y);});
  if(L.py>safeY+160){
    L.py=safeY-30;L.px=BASE_W/2-10;L.pvy=0;L.pvx=0;
  }

  // Camera follows player smoothly
  const targetCam=L.py-BASE_H*0.45;
  if(targetCam<L.camY)L.camY+=(targetCam-L.camY)*0.15;
  else L.camY+=(targetCam-L.camY)*0.08;

  // Particles
  L.particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.1;pt.life--;});
  L.particles=L.particles.filter(pt=>pt.life>0);

  // Walk animation
  if(!L.pOnGround)L.pFrame=2;
  else if(Math.abs(L.pvx)>0.3){L.pFrameTimer++;if(L.pFrameTimer>6){L.pFrame=L.pFrame===0?1:0;L.pFrameTimer=0;}}
  else L.pFrame=0;

  if(justPressed['Escape']){gameState='learnmenu';justPressed['Escape']=false;}
  clearJP();
}

function drawLearn(){
  if(gameState==='learnmenu'){drawLearnMenu();return;}
  if(gameState==='learnresult'){drawLearnResult();return;}

  const L=learn;
  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,BASE_H);
  grad.addColorStop(0,'#4488cc');grad.addColorStop(1,'#aaddff');
  ctx.fillStyle=grad;ctx.fillRect(0,0,BASE_W,BASE_H);

  // Floating clouds (parallax on camY)
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<6;i++){
    const cx=(i*130+40+Math.sin(animFrame*0.003+i)*20)%BASE_W;
    const cy=60+i*60-(L.camY*0.1)%BASE_H;
    ctx.beginPath();ctx.ellipse(cx,cy,25,12,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx-15,cy+5,15,8,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+15,cy+5,15,8,0,0,Math.PI*2);ctx.fill();
  }

  ctx.save();ctx.translate(0,-Math.round(L.camY));

  // Draw platforms
  L.platforms.forEach(pl=>{
    if(pl.isFinish){
      // Finish platform — golden
      ctx.fillStyle='#ffcc00';ctx.fillRect(pl.x,pl.y,pl.w,8);
      ctx.fillStyle='#ddaa00';ctx.fillRect(pl.x,pl.y+8,pl.w,4);
      // Star on finish
      const allSolved=L.gates.every(g=>g.solved);
      if(allSolved){
        const sb=Math.sin(animFrame*0.12)*3;
        drawSprite(STAR_S,pl.x+pl.w/2-5,pl.y-16+sb,STAR_P,2,false);
      }
    } else {
      ctx.fillStyle='#66aa55';ctx.fillRect(pl.x,pl.y,pl.w,8);
      ctx.fillStyle='#558844';ctx.fillRect(pl.x,pl.y+8,pl.w,4);
      // Grass tufts
      ctx.fillStyle='#77cc66';
      for(let gx=pl.x+4;gx<pl.x+pl.w-4;gx+=12){ctx.fillRect(gx,pl.y-2,3,3);}
    }
  });

  // Draw gates
  L.gates.forEach(gate=>{
    gate.options.forEach(opt=>{
      const isCorrectAndSolved=opt.correct&&gate.solved;
      const isWrong=opt.wrongTimer>0;

      // Platform block
      if(isCorrectAndSolved){
        ctx.fillStyle='#44dd66';
      } else if(isWrong){
        ctx.fillStyle='#dd4444';
        const shake=Math.sin(opt.wrongTimer*1.5)*3;
        ctx.save();ctx.translate(shake,0);
      } else {
        ctx.fillStyle=gate.solved?'#888899':'#6688bb';
      }
      // Draw block
      const bx=opt.x,by=opt.y,bw=opt.w,bh=28;
      ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.strokeRect(bx+1,by+1,bw-2,bh-2);

      // Letter on block
      ctx.fillStyle=isCorrectAndSolved?'#ffffff':(isWrong?'#ffcccc':'#ffffff');
      ctx.font='bold 18px monospace';ctx.textAlign='center';
      ctx.fillText(opt.letter,bx+bw/2,by+20);
      ctx.textAlign='left';

      if(isWrong)ctx.restore();
    });

    // Connecting line between gate blocks (the "gate barrier")
    if(!gate.solved){
      ctx.strokeStyle='rgba(255,100,100,0.4)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(0,gate.y+14);ctx.lineTo(BASE_W,gate.y+14);ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Player
  const ps=getPlayerSprites();
  let spr;if(L.pFrame===0)spr=ps.stand;else if(L.pFrame===1)spr=ps.run;else spr=ps.jump;
  drawSprite(spr,L.px-2,L.py-2,ps.palette,2,L.pFacing<0);

  // Feedback text
  if(L.feedback&&L.feedback.timer>0){
    const fb=L.feedback,a=fb.timer/40;
    ctx.globalAlpha=a;
    ctx.font='bold 20px monospace';ctx.textAlign='center';
    ctx.fillStyle=fb.type==='correct'?'#44ff66':'#ff4444';
    ctx.fillText(fb.type==='correct'?'✓ '+fb.text:fb.text,fb.x,fb.y-((40-fb.timer)*0.5));
    ctx.textAlign='left';ctx.globalAlpha=1;
  }

  // Particles
  L.particles.forEach(pt=>{const a=pt.life/(pt.maxLife||40);ctx.fillStyle=pt.color;ctx.globalAlpha=a;const s=pt.size||2;ctx.beginPath();ctx.arc(pt.x,pt.y,s*a,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  ctx.restore();

  // === HUD (fixed, not scrolled) ===
  // Target display at top
  const targetBg=L.mode==='words'?'rgba(0,0,0,0.6)':'rgba(0,0,0,0.5)';
  ctx.fillStyle=targetBg;
  const hudH=L.mode==='words'?50:44;
  ctx.fillRect(0,0,BASE_W,hudH);

  ctx.fillStyle='#ffdd00';ctx.font='bold 14px monospace';ctx.textAlign='center';
  const modeLabel=L.mode==='letters'?'LEIA TÄHT:':L.mode==='syllables'?'LEIA SILP:':'KIRJUTA SÕNA:';
  ctx.fillText(modeLabel,BASE_W/2,16);

  // Show target letter/syllable/word
  if(L.mode==='words'){
    // Show word with progress
    const word=L.currentTarget;
    const solvedCount=L.gates.filter(g=>g.solved).length;
    ctx.font='bold 24px monospace';
    let tx=BASE_W/2-(word.length*16)/2;
    for(let i=0;i<word.length;i++){
      const solved=i<solvedCount;
      ctx.fillStyle=solved?'#88ff88':'#ffffff44';
      ctx.textAlign='left';
      ctx.fillText(word[i],tx+i*32,44);
      if(!solved&&i===solvedCount){
        // Highlight current target letter
        ctx.fillStyle='#ffffff';
        ctx.fillText(word[i],tx+i*32,44);
        ctx.strokeStyle='#ffdd00';ctx.lineWidth=2;
        ctx.strokeRect(tx+i*32-3,26,26,24);
      }
    }
    ctx.textAlign='left';
  } else {
    ctx.fillStyle='#ffffff';ctx.font='bold 28px monospace';
    ctx.fillText(L.currentTarget,BASE_W/2,40);
  }
  ctx.textAlign='left';

  // Score and round
  ctx.fillStyle='#aaddff';ctx.font='10px monospace';
  ctx.fillText('⭐ '+(L.round+1)+'/'+L.totalRounds+'  Punktid: '+L.score,8,hudH-4);

  // Celebration overlay
  if(L.celebration>0){
    const ca=Math.min(1,L.celebration/30);
    ctx.fillStyle='rgba(0,0,0,'+(0.3*ca)+')';ctx.fillRect(0,0,BASE_W,BASE_H);
    ctx.fillStyle='#ffdd00';ctx.font='bold 28px monospace';ctx.textAlign='center';
    const cheers=['TUBLI!','VÄGA HEA!','SUPER!','SUUREPÄRANE!','FANTASTILINE!'];
    ctx.fillText(cheers[L.round%cheers.length],BASE_W/2,BASE_H/2-10);
    ctx.fillStyle='#fff';ctx.font='16px monospace';
    ctx.fillText(L.currentTarget,BASE_W/2,BASE_H/2+25);
    ctx.textAlign='left';
  }

  // Escape hint
  ctx.fillStyle='#ffffff55';ctx.font='9px monospace';ctx.fillText('ESC = tagasi',8,BASE_H-6);
}

// ==========================================
//  GAMEPAD SUPPORT
// ==========================================
const gpPrev={};
function pollGamepad(){
  const gamepads=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;
  for(let i=0;i<gamepads.length;i++){if(gamepads[i]&&gamepads[i].connected){gp=gamepads[i];break;}}
  if(!gp)return;
  // Button mapping (standard gamepad):
  // 0=A(jump), 1=B(shoot), 2=X(shoot), 3=Y(lang), 9=Start(enter), 8=Select(escape)
  // 12=DpadUp, 13=DpadDown, 14=DpadLeft, 15=DpadRight
  const btnMap={
    0:'Space',1:'KeyX',2:'KeyX',3:'KeyL',
    9:'Enter',8:'Escape',
    12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight'
  };
  Object.entries(btnMap).forEach(([bi,code])=>{
    const idx=parseInt(bi);
    if(idx>=gp.buttons.length)return;
    const pressed=gp.buttons[idx].pressed;
    const wasPressed=!!gpPrev[idx];
    if(pressed&&!wasPressed){justPressed[code]=true;keys[code]=true;}
    else if(!pressed&&wasPressed){keys[code]=false;}
    gpPrev[idx]=pressed;
  });
  // Left stick (axes 0=horizontal, 1=vertical) with deadzone
  const dz=0.4;
  const ax0=gp.axes[0]||0, ax1=gp.axes[1]||0;
  const stickL=ax0<-dz, stickR=ax0>dz, stickU=ax1<-dz, stickD=ax1>dz;
  const wasL=!!gpPrev['sL'],wasR=!!gpPrev['sR'],wasU=!!gpPrev['sU'],wasD=!!gpPrev['sD'];
  if(stickL&&!wasL){justPressed['ArrowLeft']=true;keys['ArrowLeft']=true;}
  else if(!stickL&&wasL){keys['ArrowLeft']=false;}
  if(stickR&&!wasR){justPressed['ArrowRight']=true;keys['ArrowRight']=true;}
  else if(!stickR&&wasR){keys['ArrowRight']=false;}
  if(stickU&&!wasU){justPressed['ArrowUp']=true;keys['ArrowUp']=true;}
  else if(!stickU&&wasU){keys['ArrowUp']=false;}
  if(stickD&&!wasD){justPressed['ArrowDown']=true;keys['ArrowDown']=true;}
  else if(!stickD&&wasD){keys['ArrowDown']=false;}
  gpPrev['sL']=stickL;gpPrev['sR']=stickR;gpPrev['sU']=stickU;gpPrev['sD']=stickD;
}

function drawPowerupPopup(){
  if(!powerupPopup)return;
  const pp=powerupPopup,info=POWERUP_INFO[pp.type];
  const progress=1-pp.timer/pp.maxTimer;
  const enter=Math.min(1,progress*5), exit=Math.min(1,(pp.timer/pp.maxTimer)*5);
  const alpha=Math.min(enter,exit);
  ctx.save();
  ctx.globalAlpha=alpha*0.5;
  ctx.fillStyle='#000';ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.globalAlpha=alpha;
  // Expanding ring burst
  const ringR=progress*180;
  ctx.strokeStyle=info.color;ctx.lineWidth=3;ctx.globalAlpha=alpha*(1-progress)*0.6;
  ctx.beginPath();ctx.arc(BASE_W/2,BASE_H/2,ringR,0,Math.PI*2);ctx.stroke();
  if(ringR>30){ctx.beginPath();ctx.arc(BASE_W/2,BASE_H/2,ringR*0.6,0,Math.PI*2);ctx.stroke();}
  ctx.globalAlpha=alpha;
  const bounce=enter<1?Math.sin(enter*Math.PI*0.5):1;
  const boxW=240*bounce,boxH=100*bounce;
  const bx=BASE_W/2-boxW/2,by=BASE_H/2-boxH/2;
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(bx,by,boxW,boxH);
  ctx.strokeStyle=info.color;ctx.lineWidth=3;ctx.strokeRect(bx,by,boxW,boxH);
  const shimmer=Math.sin(animFrame*0.2)*0.3+0.7;
  ctx.strokeStyle=info.color;ctx.globalAlpha=alpha*shimmer;ctx.lineWidth=1;
  ctx.strokeRect(bx+3,by+3,boxW-6,boxH-6);
  ctx.globalAlpha=alpha;
  if(bounce>0.8){
    ctx.font='36px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ffffff';
    ctx.fillText(info.icon,BASE_W/2,BASE_H/2-20);
    ctx.textBaseline='alphabetic';
    ctx.fillStyle=info.color;ctx.font='bold 20px monospace';
    ctx.fillText(info.name[lang]||info.name.en,BASE_W/2,BASE_H/2+15);
    ctx.fillStyle='#ffffff';ctx.font='12px monospace';
    ctx.fillText(info.desc[lang]||info.desc.en,BASE_W/2,BASE_H/2+35);
  }
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  for(let i=0;i<4;i++){
    const angle=animFrame*0.05+i*Math.PI/2;
    const sx=BASE_W/2+Math.cos(angle)*(boxW/2+10);
    const sy=BASE_H/2+Math.sin(angle)*(boxH/2+10);
    ctx.fillStyle=info.color;ctx.globalAlpha=alpha*shimmer;
    ctx.fillRect(sx-2,sy-2,4,4);
  }
  ctx.restore();
}

// ==========================================
//  SELF TESTS — open index.html?test=1, or run scripts/run-tests.js
// ==========================================
// `var`, not `const`: top-level const/let in a vm script never attach to the
// context object, so scripts/run-tests.js could not read the results and every
// run reported failure however many assertions passed.
var TEST_RESULTS={pass:0,fail:0};
function tAssert(name,cond,detail){
  if(cond){TEST_RESULTS.pass++;console.log('[TEST] PASS  '+name);}
  else{TEST_RESULTS.fail++;console.error('[TEST] FAIL  '+name+(detail?'  — '+detail:''));}
}
function tNear(name,actual,expected,tol){
  tAssert(name,Math.abs(actual-expected)<=tol,'expected '+expected+' ±'+tol+', got '+actual.toFixed(2));
}

// Replays the real integrator to find how high an impulse carries the player.
function simulateRise(impulse,holdJump,startRocketing){
  let vy=impulse,y=0,maxRise=0,rocketing=startRocketing;
  for(let f=0;f<1000;f++){
    vy=learnVertStep(vy,holdJump,rocketing,false);
    if(rocketSpent(vy,rocketing))rocketing=false;
    y+=vy;
    if(y<maxRise)maxRise=y;
    if(y>0&&f>2)break;
  }
  return -maxRise;
}

function testPhysics(){
  const normalHeld=simulateRise(LEARN_JUMP,true,false);
  const rocketHeld=simulateRise(LEARN_ROCKET,true,true);
  const rocketTap=simulateRise(LEARN_ROCKET,false,true);
  tNear('normal jump, held',            normalHeld,                          106.3,1);
  tNear('normal jump, tapped',          simulateRise(LEARN_JUMP,false,false),  19.1,1);
  tNear('rocket, held',                 rocketHeld,                          158.4,1);
  tNear('rocket, tapped + exemption',   rocketTap,                           158.4,1);
  tNear('rocket, tapped, NO exemption', simulateRise(LEARN_ROCKET,false,false),19.1,1);
  // Invariants that must hold even if the physics is retuned later:
  tAssert('gate cannot be skipped by a normal jump', normalHeld<GATE_GAP,
          normalHeld.toFixed(1)+' >= '+GATE_GAP);
  tAssert('rocket clears the gate even when tapped', rocketTap>GATE_GAP,
          rocketTap.toFixed(1)+' <= '+GATE_GAP);
  tAssert('rocket cannot overshoot onto the next step', rocketHeld<GATE_GAP+STEP_RISE,
          rocketHeld.toFixed(1)+' >= '+(GATE_GAP+STEP_RISE));
}

function runSelfTests(){
  TEST_RESULTS.pass=0;TEST_RESULTS.fail=0;
  console.log('[TEST] ===== start =====');
  testPhysics();
  console.log('[TEST] ===== '+TEST_RESULTS.pass+' passed, '+TEST_RESULTS.fail+' failed =====');
}
if(location.search.indexOf('test=1')>=0)window.addEventListener('load',runSelfTests);

function gameLoop(){pollGamepad();update();draw();drawPowerupPopup();requestAnimationFrame(gameLoop);}
gameLoop();
